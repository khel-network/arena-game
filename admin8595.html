// ===== TOASTS =====
function toast(msg, type = 'success') {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon = type === 'error' ? 'fa-exclamation-circle'
             : type === 'info' ? 'fa-info-circle'
             : 'fa-check-circle';
  t.innerHTML = `<i class="fas ${icon}" style="color:${type === 'error' ? '#e2555a' : type === 'info' ? '#5b3df0' : '#16c46b'};"></i><span>${escapeHtml(msg)}</span>`;
  stack.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(30px)';
    t.style.transition = '0.3s';
    setTimeout(() => t.remove(), 300);
  }, 3200);
}

// ===== HELPERS =====
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function formatRupees(n) {
  if (n === null || n === undefined) return '₹0';
  const v = Number(n) || 0;
  return (v < 0 ? '-₹' : '₹') + Math.abs(v).toLocaleString('en-IN');
}
function formatIST(dateInput) {
  const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
  if (isNaN(d.getTime())) return '—';
  try {
    return new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata',
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true
    }).format(d).replace(/\b(am|pm)\b/i, m => m.toUpperCase());
  } catch (e) { return d.toLocaleString('en-IN'); }
}
function timeAgo(dateInput) {
  const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
  if (isNaN(d.getTime())) return '—';
  const diff = Date.now() - d.getTime();
  const s = Math.floor(diff / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const days = Math.floor(h / 24);
  if (days < 7) return days + 'd ago';
  return formatIST(d);
}

    document.getElementById('denied-screen').classList.add('active');

    const { data, error } = await client.rpc('admin_adjust_balance', {
      p_user_id: userId, p_delta: amount, p_reason: reason || null

// ===== LIVE FEED (realtime) =====
async function enableLiveFeed() {
  if (liveFeedEnabled) return;
  liveFeedEnabled = true;

  // Initial batch
  try {
    const { data: tx } = await client.rpc('admin_get_recent_transactions', { p_limit: 20 });
    if (tx && tx.length) {
      liveFeedItems = tx.map(t => ({
        kind: 'tx',
        ts: t.created_at,
        text: `${t.full_name || 'User'} — ${t.description || 'transaction'} (${t.type === 'credit' ? '+' : '-'}${formatRupees(t.amount)})`
      })).sort((a, b) => new Date(b.ts) - new Date(a.ts));
      renderLiveFeed();
    } else {
      renderLiveFeed();
    }
  } catch (e) { renderLiveFeed(); }

  // Realtime: watch new transactions
  if (liveFeedChannel) { try { await client.removeChannel(liveFeedChannel); } catch (e) {} }
  liveFeedChannel = client
    .channel('admin-live-feed')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'transactions' }, (payload) => {
      const t = payload.new;
      if (!t) return;
      pushLiveItem({ kind: 'tx', ts: t.created_at, text: `New transaction: ${t.description} (${t.type === 'credit' ? '+' : '-'}${formatRupees(t.amount)})` });
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'withdrawal_requests' }, (payload) => {
      const w = payload.new;
      if (!w) return;
      pushLiveItem({ kind: 'wd', ts: w.requested_at, text: `New withdrawal request: ${formatRupees(w.amount)} to ${w.upi_id}` });
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_sessions' }, (payload) => {
      const g = payload.new;
      if (!g) return;
      pushLiveItem({ kind: 'match', ts: g.created_at, text: `New match started: ${g.game_type} (stake ₹${g.entry_fee})` });
    })
    .subscribe();
}

function pushLiveItem(item) {
  liveFeedItems.unshift(item);
  if (liveFeedItems.length > 100) liveFeedItems.length = 100;
  renderLiveFeed();
}

function renderLiveFeed() {
  const feed = document.getElementById('live-feed');
  if (!feed) return;
  if (liveFeedItems.length === 0) {
    feed.innerHTML = '<div class="table-empty">Waiting for events…</div>';
    return;
  }
  const colorMap = { tx: 'var(--primary)', wd: 'var(--amber)', match: 'var(--green)' };
  const iconMap = { tx: 'fa-receipt', wd: 'fa-hand-holding-usd', match: 'fa-gamepad' };
  feed.innerHTML = liveFeedItems.map(item => `
    <div style="display:flex;gap:12px;padding:10px 12px;background:#fafafc;border-radius:8px;border-left:3px solid ${colorMap[item.kind] || 'var(--line)'};">
      <i class="fas ${iconMap[item.kind] || 'fa-circle'}" style="color:${colorMap[item.kind] || 'var(--muted)'};margin-top:2px;"></i>
      <div style="flex:1;font-size:0.82rem;">${escapeHtml(item.text)}</div>
      <div style="font-size:0.7rem;color:var(--muted);white-space:nowrap;">${escapeHtml(timeAgo(item.ts))}</div>
    </div>
  `).join('');
}

// ===== BOOT =====
startAuthFlow();
</script>
</body>
</html>
