<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Auth Test (aggressive)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Authentication Test V1</h1>
  <button id="login">Login with Google</button>
  <div id="status">Checking...</div>
  <div id="user"></div>

  <script>
    const SUPABASE_URL = "https://sqldalrqohvhayfmbice.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxbGRhbHJxb2h2aGF5Zm1iaWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NDE3NDIsImV4cCI6MjEwMzIxNzc0Mn0.EQnqjW1HNCL9rt6SX5vgPGNX4Lgwdu6ch3HDiRSe77I";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const status = document.getElementById('status');
    const userDiv = document.getElementById('user');

    // ---- Helper: manually set session ----
    async function setSessionFromHash() {
      const hash = window.location.hash;
      if (!hash || !hash.includes('access_token')) return false;

      const params = new URLSearchParams(hash.substring(1));
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');

      if (!access_token || !refresh_token) return false;

      try {
        // First, try to set the session using the official method
        const { data, error } = await client.auth.setSession({
          access_token,
          refresh_token
        });

        if (error) {
          console.error('setSession error:', error);
          return false;
        }

        if (data && data.session) {
          console.log('✅ Session set successfully via setSession');
          // Clear hash
          window.history.replaceState(null, '', window.location.pathname);
          // Update UI
          await updateUI();
          return true;
        }
      } catch (e) {
        console.error('setSession exception:', e);
      }

      return false;
    }

    // ---- Update UI ----
    async function updateUI() {
      const { data: { session }, error } = await client.auth.getSession();
      if (error) {
        console.error('getSession error:', error);
        status.textContent = '❌ Error getting session';
        return;
      }
      if (session) {
        status.textContent = '✅ Logged in';
        userDiv.textContent = 'User: ' + session.user.email;
      } else {
        status.textContent = '❌ Not logged in';
        userDiv.textContent = '';
      }
    }

    // ---- Main init ----
    async function init() {
      // Step 1: Check if we have a hash
      const hashHandled = await setSessionFromHash();
      if (hashHandled) {
        // We've set the session, but we might need to wait for the auth listener
        // to fire. Let's also force a refresh after a short delay.
        setTimeout(async () => {
          await updateUI();
        }, 500);
        return;
      }

      // Step 2: If no hash, just check for existing session
      await updateUI();

      // Step 3: If still not logged in, but we have a stored token (fallback)
      const storageKey = 'sb-' + SUPABASE_URL.split('//')[1].split('.')[0] + '-auth-token';
      const stored = localStorage.getItem(storageKey);
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (parsed.access_token) {
            console.log('Found stored token, trying to refresh session...');
            const { data, error } = await client.auth.setSession({
              access_token: parsed.access_token,
              refresh_token: parsed.refresh_token
            });
            if (!error && data && data.session) {
              await updateUI();
            }
          }
        } catch (e) {}
      }
    }

    // ---- Auth state listener ----
    client.auth.onAuthStateChange((event, session) => {
      console.log('Auth event:', event, session ? 'session present' : 'no session');
      if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
        status.textContent = '✅ Logged in';
        userDiv.textContent = 'User: ' + session.user.email;
      } else if (event === 'SIGNED_OUT') {
        status.textContent = '❌ Not logged in';
        userDiv.textContent = '';
      }
    });

    // ---- Login button ----
    document.getElementById('login').addEventListener('click', async () => {
      const { error } = await client.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) alert(error.message);
    });

    // ---- Run ----
    init();
  </script>
</body>
</html>
