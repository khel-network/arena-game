<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Auth Test - final</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 8px; }
    button:hover { background: #357abd; }
    .status { margin: 20px 0; font-size: 18px; font-weight: bold; }
    .user { font-size: 16px; color: #333; }
    .success { color: #0a7e3c; }
    .error { color: #d93025; }
    .log { background: #f5f5f5; padding: 10px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>🔐 Authentication Test (final)</h1>
  <button id="login">Login with Google</button>
  <div class="status" id="status">⏳ Checking...</div>
  <div class="user" id="user"></div>
  <div class="log" id="log"></div>

  <script>
    // ---- ⚠️ UPDATE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS ----
    const SUPABASE_URL = "https://sqldlartqohvhayfmbie.supabase.co"; // from your dashboard
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE"; // from your dashboard
    // -----------------------------------------------------------

    // Log everything
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      console.log(msg);
    }

    log('🚀 Auth test started.');
    log('🔧 Using URL: ' + SUPABASE_URL);

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const status = document.getElementById('status');
    const userDiv = document.getElementById('user');

    // ---- 1. Handle redirect hash manually ----
    function handleRedirect() {
      const hash = window.location.hash;
      log('🔍 Hash: ' + hash);
      if (!hash || !hash.includes('access_token')) {
        log('ℹ️ No access_token in hash.');
        return false;
      }
      try {
        const params = new URLSearchParams(hash.substring(1));
        const access_token = params.get('access_token');
        const refresh_token = params.get('refresh_token');
        log('🔑 Tokens found: access_token=' + (access_token ? 'yes' : 'no') + ', refresh_token=' + (refresh_token ? 'yes' : 'no'));
        if (access_token && refresh_token) {
          // Store tokens in localStorage manually
          const storageKey = 'sb-' + SUPABASE_URL.split('//')[1].split('.')[0] + '-auth-token';
          const tokenData = {
            access_token: access_token,
            refresh_token: refresh_token,
            expires_in: 3600,
            token_type: 'bearer',
            user: null
          };
          localStorage.setItem(storageKey, JSON.stringify(tokenData));
          log('✅ Tokens stored in localStorage. Reloading...');
          // Clear hash and reload to let the client pick up the session
          window.location.hash = '';
          window.location.reload();
          return true;
        }
      } catch (e) {
        log('❌ Hash parsing error: ' + e.message);
      }
      return false;
    }

    // ---- 2. Check for existing session ----
    async function checkSession() {
      try {
        const { data: { session }, error } = await client.auth.getSession();
        if (error) {
          log('❌ getSession error: ' + error.message);
          status.textContent = '❌ Error: ' + error.message;
          status.className = 'status error';
          return;
        }
        if (session) {
          log('✅ Session found: ' + session.user.email);
          status.textContent = '✅ Logged in';
          status.className = 'status success';
          userDiv.textContent = 'User: ' + session.user.email;
        } else {
          log('ℹ️ No session found.');
          // Try to recover from localStorage
          const storageKey = 'sb-' + SUPABASE_URL.split('//')[1].split('.')[0] + '-auth-token';
          const stored = localStorage.getItem(storageKey);
          if (stored) {
            try {
              const parsed = JSON.parse(stored);
              if (parsed.access_token) {
                log('🔄 Found stored token, attempting setSession...');
                const { data, error } = await client.auth.setSession({
                  access_token: parsed.access_token,
                  refresh_token: parsed.refresh_token
                });
                if (error) {
                  log('❌ setSession error: ' + error.message);
                } else if (data && data.session) {
                  log('✅ Session restored from localStorage.');
                  status.textContent = '✅ Logged in (restored)';
                  status.className = 'status success';
                  userDiv.textContent = 'User: ' + data.session.user.email;
                  return;
                }
              }
            } catch (e) {
              log('❌ Error parsing stored token: ' + e.message);
            }
          }
          status.textContent = '❌ Not logged in';
          status.className = 'status error';
          userDiv.textContent = '';
        }
      } catch (e) {
        log('❌ checkSession exception: ' + e.message);
      }
    }

    // ---- 3. Auth state listener (backup) ----
    client.auth.onAuthStateChange((event, session) => {
      log('📡 Auth event: ' + event + (session ? ' (session present)' : ' (no session)'));
      if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
        status.textContent = '✅ Logged in';
        status.className = 'status success';
        userDiv.textContent = 'User: ' + session.user.email;
      } else if (event === 'SIGNED_OUT') {
        status.textContent = '❌ Not logged in';
        status.className = 'status error';
        userDiv.textContent = '';
      }
    });

    // ---- 4. Login button ----
    document.getElementById('login').addEventListener('click', async () => {
      log('🔄 Login clicked.');
      const redirectTo = window.location.origin + window.location.pathname;
      log('🔗 Redirecting to: ' + redirectTo);
      try {
        const { error } = await client.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: redirectTo }
        });
        if (error) {
          log('❌ Login error: ' + error.message);
          alert('Login error: ' + error.message);
        } else {
          log('⏳ Redirecting to Google...');
        }
      } catch (e) {
        log('❌ Login exception: ' + e.message);
        alert('Login exception: ' + e.message);
      }
    });

    // ---- 5. Run ----
    // Check if we came back from Google with a hash
    const handled = handleRedirect();
    if (!handled) {
      // If we didn't handle a redirect, check session normally
      checkSession();
    }
    // If handled, the page will reload, so no further actions needed.
  </script>
</body>
</html>
