<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena | Dashboard</title>
  <link rel="stylesheet" href="assets/style.css" />
  <!-- Inline fallback to guarantee hidden elements stay hidden while styles load -->
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 1. Initial Loading Screen -->
  <div id="loading" class="center-screen">
    <div class="spinner"></div>
    <p class="loading-text">Loading your dashboard...</p>
  </div>

  <!-- 2. Dashboard Interface -->
  <div id="dashboard" class="dash-wrap hidden">
    <header class="dash-header">
      <span class="brand">Arena</span>
      <button id="logout-btn" class="logout-btn" type="button">Sign out</button>
    </header>

    <!-- User Profile & Wallet -->
    <section class="card profile-card">
      <img id="avatar" class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=player" alt="Player avatar" />
      <h2 id="player-name">Player</h2>
      <div class="balance-box">
        <span class="balance-label">Token balance</span>
        <span class="balance-value" id="balance-value">0</span>
      </div>
    </section>

    <!-- Game Selection Section -->
    <section class="games-section">
      <div class="section-heading">
        <h3>Choose a game</h3>
        <p class="subtitle">Each match costs 50 tokens to enter. Win to earn 90 back.</p>
      </div>

      <div class="game-grid">
        <button class="game-card" data-game="reaction" type="button">
          <span class="game-icon">⚡</span>
          <div class="game-info">
            <h4>Reaction Duel</h4>
            <p>Fastest click wins</p>
          </div>
        </button>

        <button class="game-card" data-game="tictactoe" type="button">
          <span class="game-icon">⭕</span>
          <div class="game-info">
            <h4>Tic-Tac-Toe</h4>
            <p>Classic 1v1</p>
          </div>
        </button>

        <button class="game-card" data-game="quiz" type="button">
          <span class="game-icon">🧠</span>
          <div class="game-info">
            <h4>Quiz Battle</h4>
            <p>5 questions, most points</p>
          </div>
        </button>

        <button class="game-card" data-game="math" type="button">
          <span class="game-icon">🔢</span>
          <div class="game-info">
            <h4>Math Duel</h4>
            <p>Best of 3, fastest correct</p>
          </div>
        </button>
      </div>
    </section>
  </div>

  <!-- 3. Matchmaking Modal Overlay (Hidden by Default) -->
  <div id="match-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="spinner"></div>
      <h3 id="match-title">Finding Opponent</h3>
      <p class="subtitle" id="match-status">Looking for an opponent...</p>
      <button id="cancel-match-btn" class="cancel-btn" type="button">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabaseClient.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
