<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SkillClash | Free-to-Play Skill Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://zapupi.com/single-html-web-kit.js"></script>
<style>
  /* ===== RESET & BASE ===== */
  * { margin:0; padding:0; box-sizing:border-box; }
  *:focus-visible { outline:2px solid #00e701; outline-offset:2px; border-radius:4px; }
  * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { scroll-behavior:smooth; }
  html,body { overflow-x:hidden; width:100%; }
  body {
    font-family:'Inter',-apple-system,sans-serif;
    background:#f4f7f8;
    color:#1e293b;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  a { text-decoration:none; color:inherit; }
  button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  ul { list-style:none; }
  img { max-width:100%; display:block; }
  svg { display:block; }

  .background-blobs { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .blob { position:absolute; border-radius:50%; filter:blur(100px); opacity:.5; animation:floatBlob 16s infinite ease-in-out; }
  .blob-1 { width:380px; height:380px; background:linear-gradient(135deg,#ff7e5f,#feb47b); top:-90px; left:-90px; }
  .blob-2 { width:460px; height:460px; background:linear-gradient(135deg,#8e2de2,#4a00e0); bottom:-140px; right:-140px; animation-delay:-5s; }
  .blob-3 { width:300px; height:300px; background:linear-gradient(135deg,#11998e,#38ef7d); top:38%; left:58%; animation-delay:-10s; }
  @keyframes floatBlob { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(26px,-26px) scale(1.05);} }

  .reveal { opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity:1; transform:none; transition:none; } .blob { animation:none; } }

  /* ===== LANDING PAGE ===== */
  .site-nav {
    position:sticky; top:0; z-index:200;
    padding:12px 18px;
    display:flex; justify-content:space-between; align-items:center;
    backdrop-filter:blur(12px);
    background:rgba(255,255,255,.6);
    border-bottom:1px solid rgba(255,255,255,.7);
  }
  .brand { display:flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.2rem; letter-spacing:-0.02em; }
  .brand svg { color:#00e701; width:24px; height:24px; }
  .brand .clash { color:#5b3df0; }
  .nav-right { display:flex; align-items:center; gap:8px; }
  .btn-signin { padding:8px 16px; border-radius:100px; background:#1e293b; color:#fff; font-weight:700; font-size:.8rem; transition:.2s; white-space:nowrap; }
  .btn-signin:hover { background:#00a301; transform:translateY(-1px); }
  .menu-toggle { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8); }
  .mobile-menu { max-height:0; overflow:hidden; transition:max-height .35s ease; background:rgba(255,255,255,.8); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.7); }
  .mobile-menu.open { max-height:260px; }
  .mobile-menu-inner { display:flex; flex-direction:column; gap:2px; padding:10px 18px 16px; }
  .mobile-menu-inner a { padding:10px 6px; font-weight:600; font-size:.88rem; border-radius:8px; }
  .mobile-menu-inner a:hover { background:rgba(0,231,1,.08); }

  .ic { width:18px; height:18px; }
  .hero-wrap { max-width:1200px; margin:0 auto; padding:30px 18px 8px; }
  .hero-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,231,1,.12); color:#00a301; border:1px solid rgba(0,231,1,.25); padding:5px 14px; border-radius:100px; font-size:.7rem; font-weight:700; margin-bottom:16px; }
  .hero-badge .dot { width:6px; height:6px; border-radius:50%; background:#00e701; animation:pulseDot 1.6s infinite; }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .hero-title { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.95rem; line-height:1.14; margin-bottom:12px; }
  .hero-title .accent { color:#5b3df0; }
  .hero-sub { color:#556070; font-size:.9rem; line-height:1.6; max-width:460px; margin-bottom:20px; }
  .hero-cta-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .btn-primary-cta { display:flex; align-items:center; gap:10px; padding:13px 20px; background:#1e293b; color:#fff; border-radius:100px; font-weight:700; font-size:.85rem; transition:.2s; }
  .btn-primary-cta:hover { background:#00a301; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,231,1,.25); }
  .btn-outline-cta { display:flex; align-items:center; gap:8px; padding:13px 20px; border:1.5px solid rgba(30,41,59,.15); border-radius:100px; font-weight:700; font-size:.85rem; transition:.2s; background:rgba(255,255,255,.5); }
  .btn-outline-cta:hover { border-color:#5b3df0; color:#5b3df0; }
  .hero-trust { display:flex; align-items:center; gap:6px; font-size:.78rem; color:#556070; margin-bottom:24px; flex-wrap:wrap; }
  .hero-trust .stars { color:#f5c842; letter-spacing:1px; }
  .hero-stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px; }
  .hero-stat-box { background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:10px 6px; text-align:center; }
  .hero-stat-box .num, .hero-stat-box .num-static { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:.95rem; }
  .hero-stat-box .lbl { font-size:.58rem; color:#556070; margin-top:2px; }
  .hero-visual { position:relative; margin:30px auto 10px; max-width:300px; }
  .hero-visual-core { background:linear-gradient(145deg,#eef2ff,#f4f7f8); border:1px solid rgba(255,255,255,.9); border-radius:28px; padding:46px 20px; display:flex; align-items:center; justify-content:center; box-shadow:0 20px 60px rgba(91,61,240,.14); }
  .hero-visual-core svg { width:80px; height:80px; color:#1e293b; opacity:.85; }
  .floating-chip { position:absolute; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.9); border-radius:14px; padding:8px 12px; box-shadow:0 8px 24px rgba(0,0,0,.09); font-size:.66rem; font-weight:700; display:flex; align-items:center; gap:6px; animation:chipFloat 4s ease-in-out infinite; }
  @keyframes chipFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .chip-xp { top:-10px; left:-6px; color:#b8860b; animation-delay:0s; }
  .chip-sync { top:22%; right:-16px; color:#00a301; animation-delay:.6s; }
  .chip-fair { bottom:16%; left:-18px; color:#5b3df0; animation-delay:1.2s; }
  .chip-matches { bottom:-12px; right:2px; color:#556070; animation-delay:1.8s; }

  .section { max-width:1200px; margin:0 auto; padding:32px 18px; }
  .section-center { text-align:center; }
  .section-eyebrow-pill { display:inline-block; background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8); padding:5px 14px; border-radius:100px; font-size:.7rem; font-weight:600; color:#556070; margin-bottom:12px; }
  .section-title { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.4rem; line-height:1.22; margin-bottom:10px; }
  .section-title .accent { color:#5b3df0; }
  .section-desc { color:#556070; font-size:.83rem; line-height:1.55; max-width:440px; margin-bottom:20px; }

  .badge-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .badge-card { background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:13px; display:flex; align-items:center; gap:10px; transition:.2s; }
  .badge-card:hover { border-color:#00e701; transform:translateY(-2px); }
  .badge-card .icon-circ { width:34px; height:34px; border-radius:50%; background:rgba(91,61,240,.1); color:#5b3df0; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .badge-card span { font-weight:700; font-size:.75rem; }

  .why-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .why-card { background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8); border-radius:18px; padding:18px; transition:.25s; }
  .why-card:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(31,38,135,.08); }
  .why-card .icon-square { width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg,#5b3df0,#00e701); color:#fff; margin-bottom:12px; display:flex; align-items:center; justify-content:center; }
  .why-card h3 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.98rem; margin-bottom:4px; }
  .why-card p { color:#556070; font-size:.79rem; line-height:1.5; }

  .mode-list { display:flex; flex-direction:column; gap:10px; }
  .mode-row { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8); border-radius:16px; padding:12px 14px; transition:.2s; }
  .mode-row:hover { border-color:#00e701; transform:translateY(-2px); }
  .mode-row .mode-icon { width:38px; height:38px; border-radius:11px; background:rgba(0,231,1,.1); color:#00a301; display:flex; align-items:center; justify-content:center; }
  .mode-row .mode-text { flex:1; min-width:0; }
  .mode-row .mode-text h4 { font-size:.83rem; font-weight:700; }
  .mode-row .mode-text p { font-size:.68rem; color:#8895b0; margin-top:1px; }
  .mode-row .mode-right { text-align:right; flex-shrink:0; }
  .mode-row .mode-tag { font-size:.64rem; font-weight:700; color:#556070; display:block; margin-bottom:3px; }
  .mode-row .fairplay { font-size:.6rem; color:#00a301; font-weight:700; display:flex; align-items:center; gap:3px; justify-content:flex-end; }

  .steps-list { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .step-card { background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8); border-radius:18px; padding:16px 12px; text-align:center; position:relative; }
  .step-card .step-num { position:absolute; top:10px; right:12px; width:20px; height:20px; border-radius:50%; background:#1e293b; color:#fff; font-size:.62rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .step-card .step-icon { width:46px; height:46px; margin:0 auto 10px; border-radius:14px; background:rgba(91,61,240,.1); color:#5b3df0; display:flex; align-items:center; justify-content:center; }
  .step-card h4 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.83rem; margin-bottom:4px; }
  .step-card p { font-size:.7rem; color:#556070; line-height:1.45; }

  .compare-row { display:flex; flex-direction:column; gap:14px; }
  .compare-box { border:1.5px solid #5b3df0; border-radius:18px; padding:18px; background:rgba(91,61,240,.04); }
  .compare-box .compare-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .compare-box .compare-head strong { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1rem; }
  .compare-box .compare-head .accent { color:#5b3df0; }
  .compare-box .tag-rec { font-size:.6rem; font-weight:700; color:#5b3df0; background:rgba(91,61,240,.12); padding:2px 8px; border-radius:100px; }
  .compare-list { display:flex; flex-direction:column; gap:9px; }
  .compare-list li { display:flex; align-items:flex-start; gap:8px; font-size:.79rem; font-weight:600; }
  .compare-list li .ic { color:#00a301; margin-top:2px; width:15px; height:15px; flex-shrink:0; }
  .compare-box.other { border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.4); }
  .compare-box.other .compare-list li .ic { color:#f16464; }
  .compare-box.other .compare-list li { font-weight:500; color:#556070; }

  .challenge-row { display:flex; flex-direction:column; gap:14px; }
  .challenge-card { border-radius:20px; padding:18px; color:#fff; box-shadow:0 14px 34px rgba(91,61,240,.22); }
  .challenge-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .live-pill { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.15); padding:3px 10px; border-radius:100px; font-size:.63rem; font-weight:700; }
  .live-pill .dot { width:6px; height:6px; border-radius:50%; background:#4ade80; animation:pulseDot 1.4s infinite; }
  .fair-pill { background:rgba(255,255,255,.15); padding:3px 10px; border-radius:100px; font-size:.63rem; font-weight:700; }
  .challenge-meta { font-size:.66rem; opacity:.8; margin-bottom:4px; }
  .challenge-title { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.98rem; margin-bottom:12px; }
  .challenge-stats { display:flex; justify-content:space-between; margin-bottom:10px; }
  .challenge-stats div { text-align:center; }
  .challenge-stats .val { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:.9rem; }
  .challenge-stats .lbl { font-size:.58rem; opacity:.75; text-transform:uppercase; letter-spacing:.04em; }
  .challenge-progress-row { display:flex; justify-content:space-between; font-size:.63rem; opacity:.85; margin-bottom:5px; }
  .challenge-track { width:100%; height:5px; background:rgba(255,255,255,.2); border-radius:100px; overflow:hidden; margin-bottom:14px; }
  .challenge-fill { height:100%; background:#fff; border-radius:100px; width:0; transition:width 1.1s ease; }
  .btn-join-challenge { width:100%; padding:12px; background:#fff; color:#4c1d95; border-radius:12px; font-weight:800; font-size:.83rem; transition:.2s; }
  .btn-join-challenge:hover { background:#f0f0ff; transform:translateY(-1px); }

  .scoreboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .scoreboard-box { background:rgba(30,41,59,.03); border:1px solid rgba(255,255,255,.8); border-radius:16px; padding:16px 10px; text-align:center; }
  .scoreboard-box .val { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.25rem; color:#5b3df0; }
  .scoreboard-box .lbl { font-size:.68rem; color:#556070; margin-top:3px; }

  .testi-list { display:flex; flex-direction:column; gap:12px; }
  .testi-card { background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8); border-radius:18px; padding:16px; }
  .testi-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .testi-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#5b3df0,#00e701); color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:.85rem; flex-shrink:0; }
  .testi-name { font-weight:700; font-size:.82rem; display:flex; align-items:center; gap:4px; }
  .testi-name .ic { width:12px; height:12px; color:#00a301; }
  .testi-loc { font-size:.68rem; color:#8895b0; }
  .testi-stars { color:#f5c842; font-size:.7rem; margin-bottom:6px; letter-spacing:1px; }
  .testi-quote { font-size:.78rem; color:#334155; line-height:1.55; }

  .faq-list { display:flex; flex-direction:column; gap:8px; }
  .faq-item { background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8); border-radius:14px; overflow:hidden; }
  .faq-item summary { padding:14px 16px; font-weight:700; font-size:.83rem; cursor:pointer; display:flex; justify-content:space-between; align-items:center; list-style:none; }
  .faq-item summary::-webkit-details-marker { display:none; }
  .faq-item summary .plus { transition:.25s; color:#5b3df0; flex-shrink:0; }
  .faq-item[open] summary .plus { transform:rotate(45deg); }
  .faq-item p { padding:0 16px 14px; font-size:.78rem; color:#556070; line-height:1.55; }

  .community-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .community-card { background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; transition:.2s; }
  .community-card:hover { border-color:#00e701; transform:translateY(-2px); }
  .community-card .icon-circ { width:36px; height:36px; border-radius:50%; background:rgba(91,61,240,.1); color:#5b3df0; display:flex; align-items:center; justify-content:center; }
  .community-card span { font-weight:700; font-size:.72rem; }
  .community-card small { font-size:.62rem; color:#8895b0; }

  .closing-cta { background:linear-gradient(135deg,#1e1b4b,#5b3df0); border-radius:24px; padding:34px 22px; text-align:center; color:#fff; margin:0 18px 32px; max-width:1160px; margin-left:auto; margin-right:auto; }
  .closing-cta .badge-pill { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); padding:5px 14px; border-radius:100px; font-size:.68rem; font-weight:700; margin-bottom:14px; }
  .closing-cta h2 { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.5rem; margin-bottom:10px; }
  .closing-cta p { font-size:.85rem; opacity:.85; max-width:420px; margin:0 auto 20px; line-height:1.55; }
  .btn-closing { display:inline-flex; align-items:center; gap:10px; background:#fff; color:#1e1b4b; padding:14px 26px; border-radius:100px; font-weight:800; font-size:.88rem; transition:.2s; }
  .btn-closing:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.2); }

  .site-footer { border-top:1px solid rgba(255,255,255,.7); background:rgba(255,255,255,.5); padding:22px 18px 26px; text-align:center; }
  .footer-brand { display:inline-flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1rem; margin-bottom:10px; }
  .footer-brand svg { width:20px; height:20px; color:#00e701; }
  .site-footer p { font-size:.68rem; color:#8895b0; line-height:1.6; max-width:480px; margin:0 auto; }
  .fair-note { display:inline-flex; align-items:center; gap:5px; font-size:.68rem; color:#00a301; font-weight:700; margin-top:10px; }
  .fair-note .dot { width:6px; height:6px; border-radius:50%; background:#00e701; }

  @media (min-width:760px){
    .hero-wrap { display:flex; align-items:center; gap:40px; padding:56px 24px; }
    .hero-left { flex:1; }
    .hero-right { flex:1; }
    .hero-title { font-size:2.5rem; }
    .hero-stats-grid { grid-template-columns:repeat(4,minmax(105px,1fr)); max-width:460px; }
    .badge-grid { grid-template-columns:repeat(3,1fr); }
    .why-grid { grid-template-columns:repeat(3,1fr); }
    .steps-list { grid-template-columns:repeat(4,1fr); }
    .compare-row { flex-direction:row; }
    .compare-row .compare-box { flex:1; }
    .challenge-row { flex-direction:row; }
    .challenge-row .challenge-card { flex:1; }
    .scoreboard-grid { grid-template-columns:repeat(4,1fr); }
    .testi-list { flex-direction:row; }
    .testi-list .testi-card { flex:1; }
    .community-grid { grid-template-columns:repeat(5,1fr); }
  }

  /* ===== DASHBOARD ===== */
  .app-wrap { min-height: 100vh; background: transparent; }
  .top-nav {
    background: rgba(255,255,255,0.45);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.7);
    padding: 10px 12px 6px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-container { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .nav-top-row { display: flex; justify-content: space-between; align-items: center; }
  .brand-small { display: flex; align-items: center; gap: 4px; font-family: 'Space Grotesk', sa
