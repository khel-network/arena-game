<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — SkillClash</title>
<style>
  body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:#fafafc; color:#161522; display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .card { max-width:320px; }
  h1 { font-size:1.4rem; margin-bottom:10px; color:#5b3df0; }
  p { color:#5c5a6e; font-size:0.9rem; line-height:1.6; }
  button { margin-top:20px; padding:12px 24px; border-radius:12px; background:#5b3df0; color:#fff; font-weight:700; border:none; cursor:pointer; font-size:0.9rem; }
</style>
</head>
<body>
<div class="card">
  <h1>You're offline</h1>
  <p>SkillClash needs an internet connection for matches and wallet updates. Please reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
